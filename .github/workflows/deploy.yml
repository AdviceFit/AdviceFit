name: Deploy Frontend & Backend

on:
  push:
    branches:
      - development

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend_changed: ${{ steps.filter.outputs.frontend }}
      backend_changed: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Check for Changes
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

  deploy-frontend:
    needs: check-changes
    if: needs.check-changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          cd frontend
          rm -rf node_modules
          npm ci

      - name: Build Frontend
        run: |
          cd frontend
          rm -rf .next
          npm run build

      - name: Add SSH Key and Known Hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.FRONTEND_AWS_HOST }} >> ~/.ssh/known_hosts

      - name: Upload Build to EC2 using rsync
        run: |
          rsync -avz --delete frontend/.next frontend/public frontend/package.json frontend/package-lock.json ${{ secrets.AWS_USER }}@${{ secrets.FRONTEND_AWS_HOST }}:~/repo/frontend

      - name: Serve Frontend with PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.FRONTEND_AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            echo "📁 Navigating to frontend directory..."
            cd ~/repo/frontend

            echo "🌐 Starting Next.js app with PM2..."
            pm2 delete frontend || true
            pm2 start "npm run start" --name "frontend"

  deploy-backend:
    needs: check-changes
    if: needs.check-changes.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        run: |
          cd backend
          rm -rf node_modules
          npm ci

      - name: Add SSH Key and Known Hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 22 -H ${{ secrets.BACKEND_AWS_HOST }} >> ~/.ssh/known_hosts

      - name: Upload Backend to EC2 using rsync
        run: |
          rsync -avz --delete \
            backend/src \
            backend/package.json \
            backend/package-lock.json \
            backend/node_modules \
            ${{ secrets.AWS_USER }}@${{ secrets.BACKEND_AWS_HOST }}:~/repo/backend


      - name: Restart Backend with PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BACKEND_AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            echo "📂 Navigating to backend directory..."
            cd ~/repo/backend

            echo "🔁 Restarting backend with pm2..."
            pm2 restart backend || pm2 start src/app.js --name backend --cwd ~/repo/backend

