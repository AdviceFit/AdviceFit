name: Deploy Frontend & Backend

on:
  push:
    branches:
      - development

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend_changed: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Check for Changes
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            frontend:
              - 'frontend/**'

  deploy-frontend:
    needs: check-changes
    if: needs.check-changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Upload Build to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.FRONTEND_AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.PRIVATE_KEY }}
          source: "frontend/.next"
          target: "~/repo/frontend"

      - name: Serve Build with pm2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.FRONTEND_AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            echo "📦 Ensuring 'serve' is installed globally..."
            npm install -g serve

            echo "🔁 Restarting frontend using serve via pm2..."
            pm2 delete frontend || true
            pm2 start serve --name "frontend" -- -s ~/repo/frontend/build -l 3000

  deploy-backend:
    needs: check-changes
    if: needs.check-changes.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BACKEND_AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.PRIVATE_KEY }}
          timeout: 20m
          script: |
            set -e
            echo "🚀 Deploying backend..."

            if [ -d ~/repo/.git ]; then
              echo "✅ Repository exists. Pulling latest changes..."
              cd ~/repo
              git reset --hard
              git clean -fd
              git checkout development
              git pull origin development
            else
              echo "📦 Cloning repository..."
              rm -rf ~/repo
              git clone git@github.com:AdviceFit/AdviceFit.git ~/repo
            fi

            echo "📂 Navigating to backend directory..."
            cd ~/repo/backend

            echo "📥 Installing dependencies..."
            npm ci

            echo "🔁 Restarting backend with pm2..."
            pm2 restart backend || pm2 start src/app.js --name backend --cwd ~/repo/backend
